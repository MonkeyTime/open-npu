name: Vérifications OPEN-NPU
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps -r requirements-server.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Verify Ubuntu deployment and redeployment
        run: |
          bash -n deploy/ubuntu.sh
          sudo bash deploy/ubuntu.sh --domain localhost
          first_secret=$(sudo sha256sum deploy/secrets/admin.txt)
          sudo bash deploy/ubuntu.sh
          test "$first_secret" = "$(sudo sha256sum deploy/secrets/admin.txt)"
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: ./.venv/Scripts/python.exe -m pip install -r requirements.txt
      - run: ./build-agent.ps1
