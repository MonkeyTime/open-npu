services:
  open-npu:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      OPEN_NPU_MODE: pilot
      OPEN_NPU_BIND: 0.0.0.0
      OPEN_NPU_PRIVATE_PROXY: "1"
      OPEN_NPU_PUBLIC_ENROLLMENT: ${OPEN_NPU_PUBLIC_ENROLLMENT:-0}
      OPEN_NPU_RUNTIME: /state
      OPEN_NPU_ADMIN_SECRET_FILE: /run/secrets/admin
      OPEN_NPU_TRUSTED_HOSTS: ${OPEN_NPU_DOMAIN:?Set the pilot domain}
    secrets:
      - admin
    volumes:
      - state:/state
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8787/health/ready', headers={'Host': os.environ['OPEN_NPU_TRUSTED_HOSTS']}), timeout=4).close()"
      interval: 30s
      timeout: 5s
      retries: 3
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      OPEN_NPU_DOMAIN: ${OPEN_NPU_DOMAIN:?Set the pilot domain}
      OPEN_NPU_ADMIN_CIDR: ${OPEN_NPU_ADMIN_CIDR:?Set the administration VPN address range}
    depends_on:
      open-npu:
        condition: service_healthy
    networks:
      - default
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
networks:
  backend:
    internal: true
secrets:
  admin:
    file: ${OPEN_NPU_ADMIN_SECRET_PATH:?Set the path to a private secret file}
volumes:
  state:
  caddy-data:
  caddy-config:
